<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comics Script Editor</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --orange: #db6d28;
    --font-mono: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    line-height: 1.6;
    min-height: 100vh;
  }

  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .header h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
  }

  .header .subtitle {
    color: var(--text-dim);
    font-size: 13px;
  }

  .main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    height: calc(100vh - 57px);
  }

  .panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }

  .panel-header h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
  }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 0;
  }

  .left-panel {
    border-right: 1px solid var(--border);
  }

  textarea#spec-input {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    border: none;
    padding: 16px;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.5;
    resize: none;
    outline: none;
    tab-size: 2;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  select, button {
    font-family: var(--font-sans);
    font-size: 12px;
    border-radius: 6px;
    cursor: pointer;
  }

  select {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 5px 8px;
  }

  .btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-weight: 500;
    transition: all 0.15s;
  }

  .btn:hover { background: var(--border); }

  .btn-primary {
    background: #238636;
    border-color: rgba(240,246,252,0.1);
    color: #fff;
  }
  .btn-primary:hover { background: #2ea043; }

  .btn-rewrite {
    background: #1f6feb;
    border-color: rgba(240,246,252,0.1);
    color: #fff;
  }
  .btn-rewrite:hover { background: #388bfd; }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Results panel */
  .results-area {
    padding: 16px;
  }

  .status-banner {
    padding: 12px 16px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-weight: 600;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-green { background: rgba(63,185,80,0.15); color: var(--green); border: 1px solid rgba(63,185,80,0.3); }
  .status-yellow { background: rgba(210,153,34,0.15); color: var(--yellow); border: 1px solid rgba(210,153,34,0.3); }
  .status-red { background: rgba(248,81,73,0.15); color: var(--red); border: 1px solid rgba(248,81,73,0.3); }

  .counts {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
    font-size: 13px;
  }

  .count-badge {
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 12px;
  }

  .cb-fail { background: rgba(248,81,73,0.2); color: var(--red); }
  .cb-warn { background: rgba(210,153,34,0.2); color: var(--yellow); }
  .cb-note { background: rgba(88,166,255,0.2); color: var(--accent); }
  .cb-pass { background: rgba(63,185,80,0.2); color: var(--green); }

  .result-item {
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 8px;
    overflow: hidden;
  }

  .result-header {
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    cursor: pointer;
    background: var(--surface);
  }

  .result-header:hover { background: var(--surface2); }

  .result-level {
    font-size: 11px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .rl-FAIL { background: var(--red); color: #fff; }
  .rl-WARN { background: var(--yellow); color: #000; }
  .rl-NOTE { background: var(--accent); color: #000; }
  .rl-PASS { background: var(--green); color: #000; }

  .result-rule-id {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
  }

  .result-message {
    flex: 1;
    color: var(--text);
  }

  .result-detail {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    background: var(--bg);
    display: none;
  }

  .result-detail.open { display: block; }

  .result-detail p {
    margin-bottom: 6px;
    color: var(--text-dim);
  }

  .result-detail .fix {
    color: var(--green);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 4px 8px;
    background: rgba(63,185,80,0.1);
    border-radius: 4px;
    margin-top: 4px;
    display: block;
  }

  .result-detail .evidence {
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 4px 8px;
    background: rgba(139,148,158,0.1);
    border-radius: 4px;
    margin-top: 4px;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 150px;
    overflow-y: auto;
  }

  /* Rewrite actions */
  .rewrite-section {
    margin-bottom: 20px;
  }

  .rewrite-section h3 {
    font-size: 14px;
    margin-bottom: 10px;
    color: var(--accent);
  }

  .action-item {
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 6px;
    padding: 10px 12px;
    background: var(--surface);
    font-size: 12px;
  }

  .action-location {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .action-field {
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }

  .action-old {
    color: var(--red);
    font-family: var(--font-mono);
    font-size: 11px;
    text-decoration: line-through;
    opacity: 0.7;
  }

  .action-new {
    color: var(--green);
    font-family: var(--font-mono);
    font-size: 11px;
  }

  .action-reason {
    color: var(--text-dim);
    font-size: 11px;
    margin-top: 4px;
    font-style: italic;
  }

  /* Loading spinner */
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--text-dim);
  }

  .empty-state h3 {
    font-size: 16px;
    margin-bottom: 8px;
    color: var(--text);
  }

  .empty-state p {
    font-size: 13px;
    max-width: 400px;
    margin: 0 auto;
    line-height: 1.5;
  }

  /* Tabs for output */
  .output-tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .output-tab {
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    font-family: var(--font-sans);
  }

  .output-tab:hover { color: var(--text); }
  .output-tab.active { color: var(--text); border-bottom-color: var(--accent); }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Spec output tab */
  .spec-output {
    width: 100%;
    height: calc(100vh - 160px);
    background: var(--bg);
    color: var(--text);
    border: none;
    padding: 16px;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.5;
    resize: none;
    outline: none;
  }

  /* Template selector */
  .template-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-dim);
  }

  @media (max-width: 900px) {
    .main { grid-template-columns: 1fr; }
    .left-panel { border-right: none; border-bottom: 1px solid var(--border); max-height: 40vh; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>Comics Script Editor</h1>
  <span class="subtitle">Critic &bull; Rewriter &bull; Studio</span>
</div>

<div class="main">
  <!-- LEFT: Input -->
  <div class="panel left-panel">
    <div class="panel-header">
      <h2>Script Spec (JSON)</h2>
      <div class="controls">
        <select id="template-select" title="Load a sample spec">
          <option value="">Load template...</option>
          <option value="flawed">Flawed Sample (4 pages)</option>
          <option value="minimal">Minimal Spec</option>
          <option value="studio">Studio Seed</option>
        </select>
      </div>
    </div>
    <div class="panel-body">
      <textarea id="spec-input" spellcheck="false" placeholder='Paste your comic script spec JSON here...

{
  "premise": "...",
  "protagonist": "...",
  "pages": [
    {
      "page_no": 1,
      "panels": [
        { "art": "...", "text": [...] }
      ]
    }
  ]
}'></textarea>
    </div>
    <div class="panel-header" style="border-top: 1px solid var(--border); border-bottom: none;">
      <div class="controls">
        <select id="mode-select">
          <option value="critic">Critic</option>
          <option value="rewrite" selected>Rewrite</option>
          <option value="studio">Studio</option>
        </select>
        <select id="gate-select">
          <option value="P0">Gate: P0</option>
          <option value="P1" selected>Gate: P1</option>
          <option value="P2">Gate: P2</option>
          <option value="P4">Gate: P4</option>
          <option value="P7">Gate: P7 (all)</option>
        </select>
      </div>
      <div class="controls">
        <button class="btn btn-rewrite" id="btn-run" onclick="runAnalysis()">
          Run Editor
        </button>
      </div>
    </div>
  </div>

  <!-- RIGHT: Output -->
  <div class="panel">
    <div class="output-tabs" id="output-tabs">
      <button class="output-tab active" data-tab="results">Results</button>
      <button class="output-tab" data-tab="actions">Rewrites</button>
      <button class="output-tab" data-tab="spec-out">Fixed Spec</button>
      <button class="output-tab" data-tab="raw">Raw JSON</button>
    </div>
    <div class="panel-body">
      <!-- Results tab -->
      <div class="tab-content active" id="tab-results">
        <div class="empty-state" id="empty-state">
          <h3>Paste a script spec and hit Run</h3>
          <p>The editor will analyze your comic script JSON against 25+ writing rules, then rewrite the weak spots with real content.</p>
        </div>
        <div class="results-area" id="results-area" style="display:none;"></div>
      </div>
      <!-- Rewrite actions tab -->
      <div class="tab-content" id="tab-actions">
        <div class="results-area" id="actions-area">
          <div class="empty-state">
            <p>Run in Rewrite mode to see changes.</p>
          </div>
        </div>
      </div>
      <!-- Fixed spec tab -->
      <div class="tab-content" id="tab-spec-out">
        <textarea class="spec-output" id="spec-output" readonly placeholder="The rewritten spec will appear here..."></textarea>
      </div>
      <!-- Raw JSON tab -->
      <div class="tab-content" id="tab-raw">
        <textarea class="spec-output" id="raw-output" readonly placeholder="Raw API response will appear here..."></textarea>
      </div>
    </div>
  </div>
</div>

<script>
// Templates
const TEMPLATES = {
  flawed: {
    title: "The Last Courier",
    medium_target: "comics",
    genre: "noir sci-fi",
    tone: "tense",
    premise: "Mara delivers packages in a flooded megacity",
    protagonist: "Mara",
    protagonist_goal: "deliver the stolen data core before dawn",
    stakes: "bad things happen",
    character_change: "",
    target_emotion: "dread",
    flaws: ["control issues"],
    obstacles: ["a corrupt checkpoint"],
    beats: [
      {name: "Opening", change: "", new_problem: "", cost: ""},
      {name: "Complication", change: "things get worse", new_problem: "the cops show up", cost: ""},
      {name: "Escalation", change: "", new_problem: "", cost: ""},
      {name: "Climax fight scene", change: "", new_problem: "", cost: ""}
    ],
    character_reveals: [{pressure: "she's cornered", choice: "", cost: ""}],
    characters: [{role: "protagonist", name: "Mara"}],
    pages: [
      {page_no: 1, page_type: "normal", panels: [
        {art: "Wide shot of flooded megacity at night.", text: [{type: "caption", value: "Well, basically, I mean, it was just really kind of a very normal night in the Zone. Mara moved through the flooded streets, actually thinking about all the things she had to do, you know, sort of wondering if mah luck would hold."}]},
        {art: "", text: [{type: "balloon", value: "Mara: I gotta get muh package through before dawn or we're all done for, you know what I mean?"}]},
        {art: "Close-up of Mara's face.", text: []},
        {art: "Medium shot of Mara walking.", text: [{type: "balloon", value: "Ah think we should go."}]}
      ]},
      {page_no: 2, page_type: "normal", panels: [
        {art: "Mara at the checkpoint.", text: [{type: "balloon", value: "Guard: Papers. Now."}]},
        {art: "Mara reaching into her jacket.", text: [{type: "balloon", value: "Mara: Here. Everything's in order."}]},
        {art: "", text: [{type: "balloon", value: "Guard: This expired yesterday."}]},
        {art: "Wide shot of the checkpoint.", text: [{type: "balloon", value: "Mara: That's impossible. Check again."}]}
      ]},
      {page_no: 3, page_type: "normal", panels: [
        {art: "Mara running through alleys.", text: [{type: "caption", value: "She ran."}]},
        {art: "Overhead shot of pursuit.", silent_intent: "The chase is on.", text: []},
        {art: "Mara ducking into a doorway.", text: [{type: "balloon", value: "Mara: Come on, come on..."}]},
        {art: "The door slams shut.", text: [{type: "sfx", value: "SLAM"}]}
      ]},
      {page_no: 4, page_type: "normal", panels: [
        {art: "Interior safe house. Dim light.", text: [{type: "caption", value: "Safe. For now."}]},
        {art: "Mara examines the data core.", text: [{type: "balloon", value: "Mara: This better be worth it."}]},
        {art: "Close-up of the data core glowing.", silent_intent: "The core pulses with stolen secrets.", text: []},
        {art: "Mara looks out the window.", text: [{type: "caption", value: "Dawn in three hours."}]}
      ]}
    ]
  },
  minimal: {
    premise: "A courier must deliver a package across a dangerous city",
    protagonist: "Alex",
    protagonist_goal: "deliver the package before the deadline",
    stakes: "",
    pages: [
      {page_no: 1, page_type: "normal", panels: [
        {art: "Wide establishing shot of the city.", text: [{type: "caption", value: "The city never sleeps."}]},
        {art: "Alex receives the package.", text: [{type: "balloon", value: "Alex: I'll get it there."}]},
        {art: "Alex heads out the door.", silent_intent: "Determination.", text: []}
      ]}
    ]
  },
  studio: {
    genre: "noir sci-fi",
    tone: "tense, propulsive",
    page_count: 22,
    hook: "memory theft",
    setting: "flooded megacity where data is currency",
    rng_seed: 42
  }
};

// Tab switching
document.querySelectorAll('.output-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.output-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
  });
});

// Template loading
document.getElementById('template-select').addEventListener('change', function() {
  const key = this.value;
  if (!key || !TEMPLATES[key]) return;
  document.getElementById('spec-input').value = JSON.stringify(TEMPLATES[key], null, 2);
  // Auto-set mode for studio template
  if (key === 'studio') {
    document.getElementById('mode-select').value = 'studio';
  } else {
    document.getElementById('mode-select').value = 'rewrite';
  }
  this.value = '';
});

// Update button text based on mode
document.getElementById('mode-select').addEventListener('change', function() {
  const btn = document.getElementById('btn-run');
  const labels = { critic: 'Analyze', rewrite: 'Rewrite', studio: 'Generate' };
  btn.textContent = labels[this.value] || 'Run';
  btn.className = 'btn ' + (this.value === 'rewrite' ? 'btn-rewrite' : 'btn-primary');
});

// Main action
async function runAnalysis() {
  const btn = document.getElementById('btn-run');
  const input = document.getElementById('spec-input').value.trim();
  const mode = document.getElementById('mode-select').value;
  const gate = document.getElementById('gate-select').value;

  if (!input) {
    alert('Paste a script spec JSON in the left panel first.');
    return;
  }

  let parsed;
  try {
    parsed = JSON.parse(input);
  } catch(e) {
    alert('Invalid JSON: ' + e.message);
    return;
  }

  // Build request
  const body = { mode, gate, full_report: true };
  if (mode === 'studio') {
    body.seed = parsed;
    body.n = parsed.n || 3;
  } else {
    body.spec = parsed;
    if (mode === 'rewrite') {
      body.rewrite_passes = 2;
    }
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Running...';

  try {
    const resp = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await resp.json();

    if (data.error) {
      alert('Error: ' + data.error);
      return;
    }

    renderResults(data);
    renderActions(data);
    renderSpecOutput(data);
    document.getElementById('raw-output').value = JSON.stringify(data, null, 2);

    // Show results tab, or actions tab for rewrite mode
    document.querySelectorAll('.output-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    if (mode === 'rewrite' && data.rewrite_actions && data.rewrite_actions.length > 0) {
      document.querySelector('[data-tab="actions"]').classList.add('active');
      document.getElementById('tab-actions').classList.add('active');
    } else {
      document.querySelector('[data-tab="results"]').classList.add('active');
      document.getElementById('tab-results').classList.add('active');
    }
  } catch(e) {
    alert('Request failed: ' + e.message);
  } finally {
    btn.disabled = false;
    const labels = { critic: 'Analyze', rewrite: 'Rewrite', studio: 'Generate' };
    btn.textContent = labels[mode] || 'Run';
  }
}

function renderResults(data) {
  const area = document.getElementById('results-area');
  const empty = document.getElementById('empty-state');
  empty.style.display = 'none';
  area.style.display = 'block';

  const summary = data.summary || {};
  const results = data.results || [];
  const status = summary.status || 'red';
  const counts = summary.counts || {};
  const gate = data.gate || {};

  let html = '';

  // Status banner
  const statusText = {
    green: 'PASS — Script meets all gates',
    yellow: 'WARNINGS — Script has issues to address',
    red: 'FAIL — Script has critical problems'
  };
  html += `<div class="status-banner status-${status}">${statusText[status] || status.toUpperCase()}</div>`;

  // Rewrite summary if applicable
  if (data.mode === 'rewrite' && data.total_rewrites > 0) {
    html += `<div class="status-banner" style="background:rgba(31,111,235,0.15);color:var(--accent);border:1px solid rgba(31,111,235,0.3);">
      REWRITE: ${data.total_rewrites} changes across ${data.rewrite_passes} pass${data.rewrite_passes > 1 ? 'es' : ''}
    </div>`;
  }

  // Counts
  html += '<div class="counts">';
  if (counts.FAIL) html += `<span class="count-badge cb-fail">${counts.FAIL} FAIL</span>`;
  if (counts.WARN) html += `<span class="count-badge cb-warn">${counts.WARN} WARN</span>`;
  if (counts.NOTE) html += `<span class="count-badge cb-note">${counts.NOTE} NOTE</span>`;
  if (counts.PASS) html += `<span class="count-badge cb-pass">${counts.PASS} PASS</span>`;
  html += '</div>';

  // Gate
  if (gate.message) {
    html += `<div style="margin-bottom:16px;padding:8px 12px;background:rgba(248,81,73,0.1);border:1px solid rgba(248,81,73,0.2);border-radius:6px;font-size:12px;font-family:var(--font-mono);color:var(--red);white-space:pre-wrap;">${escHtml(gate.message)}</div>`;
  }

  // Results list
  for (const r of results) {
    const level = r.level || 'PASS';
    const expanded = (level === 'FAIL' || level === 'WARN');
    html += `<div class="result-item">
      <div class="result-header" onclick="this.nextElementSibling.classList.toggle('open')">
        <span class="result-level rl-${level}">${level}</span>
        <span class="result-rule-id">${escHtml(r.rule_id)}</span>
        <span class="result-message">${escHtml(r.message)}</span>
      </div>
      <div class="result-detail ${expanded ? 'open' : ''}">
        ${r.location ? `<p>Location: <code>${escHtml(r.location)}</code></p>` : ''}
        ${(r.fixes || []).map(f => `<span class="fix">FIX: ${escHtml(f)}</span>`).join('')}
        ${r.evidence && Object.keys(r.evidence).length ? `<div class="evidence">${escHtml(JSON.stringify(r.evidence, null, 2))}</div>` : ''}
      </div>
    </div>`;
  }

  // Studio mode: show generated specs
  if (data.mode === 'studio' && data.generated_specs) {
    html += '<h3 style="margin:20px 0 10px;color:var(--accent);">Generated Ideas</h3>';
    for (const [i, item] of data.generated_specs.entries()) {
      const spec = item.spec || {};
      const ok = item.gate?.ok;
      html += `<div class="action-item">
        <div class="action-field">${i+1}. ${escHtml(spec.title || 'Untitled')}</div>
        <div style="font-size:12px;color:var(--text-dim);margin:4px 0;">${escHtml(spec.premise || '')}</div>
        <div style="font-size:11px;">
          <span class="count-badge ${ok ? 'cb-pass' : 'cb-fail'}">${ok ? 'PASS' : 'FAIL'}</span>
          Status: ${item.summary?.status || '?'}
        </div>
      </div>`;
    }
  }

  area.innerHTML = html;
}

function renderActions(data) {
  const area = document.getElementById('actions-area');
  const actions = data.rewrite_actions || [];

  if (!actions.length) {
    area.innerHTML = '<div class="empty-state"><p>No rewrite actions. Run in Rewrite mode to see changes.</p></div>';
    return;
  }

  let html = `<div class="rewrite-section">
    <h3>${actions.length} Rewrite${actions.length !== 1 ? 's' : ''} Applied</h3>`;

  for (const a of actions) {
    html += `<div class="action-item">
      <div class="action-location">${escHtml(a.location)} &rarr; ${escHtml(a.field)}</div>
      ${a.old_value ? `<div class="action-old">${escHtml(a.old_value)}</div>` : ''}
      <div class="action-new">${escHtml(a.new_value)}</div>
      <div class="action-reason">${escHtml(a.reason)}</div>
    </div>`;
  }

  html += '</div>';
  area.innerHTML = html;
}

function renderSpecOutput(data) {
  const el = document.getElementById('spec-output');
  if (data.spec) {
    el.value = JSON.stringify(data.spec, null, 2);
  } else if (data.generated_specs && data.generated_specs.length) {
    el.value = JSON.stringify(data.generated_specs.map(g => g.spec), null, 2);
  } else {
    el.value = '(No spec output for this mode)';
  }
}

function escHtml(s) {
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}
</script>

</body>
</html>
